# Kashk Al-Ward (كشك الورد) - Nginx Configuration for illevante.sy
# High Performance Zero-PHP Static Serving & Browser Caching

server {
    listen 80;
    listen [::]:80;
    server_name kashkalward.sy www.kashkalward.sy;
    root /var/www/kashkalward/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 64M;

    index index.php;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff2 font/woff;

    # 1. Zero-PHP Static Storage Delivery (/storage/...)
    # Serves images directly from kernel cache / sendfile without invoking PHP or touching Database
    location /storage/ {
        alias /var/www/kashkalward/storage/app/public/;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    # 2. Immutable Caching for Static Assets (Images, CSS, JS, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # 3. Main Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # 4. FastCGI PHP-FPM Handler for Dynamic Requests only
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust PHP version as needed
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
