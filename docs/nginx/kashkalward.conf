server {
    listen 80;
    server_name kashkalward.com www.kashkalward.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kashkalward.com www.kashkalward.com;

    ssl_certificate     /etc/letsencrypt/live/kashkalward.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kashkalward.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /srv/kashk-al-ward/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;  # Enough for product image uploads

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite-built assets are fingerprinted — safe to cache for 1 year
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded product images
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Block access to hidden files (except /.well-known for Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block access to sensitive Laravel files
    location ~ ^/(\.env|composer\.(json|lock)|package\.json|phpunit\.xml) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/kashk-access.log;
    error_log  /var/log/nginx/kashk-error.log warn;
}
